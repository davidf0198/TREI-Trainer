<!doctype html>
<html lang="de"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">

<title>TREI-Kurs & Prüfungstrainer</title>
<style>
:root{--bg:#eef1f3;--paper:#fff;--ink:#18212b;--muted:#5a6772;--line:#d3dae0;--accent:#1d5fae;--accent-ink:#fff;--bad:#b3261e;--pe-green:#2e8b3a;--pe-yellow:#e5c22e;--brown:#7b4a2a;--grey:#7d8790}
@media (prefers-color-scheme:dark){:root{--bg:#12171c;--paper:#1a2129;--ink:#e6ebef;--muted:#9aa7b2;--line:#2d3842;--accent:#6ea6ec;--accent-ink:#0d1620;--bad:#f08a80;--brown:#c08a62;--grey:#a2acb5;color-scheme:dark}}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;background:var(--bg);color:var(--ink);font:16px/1.5 "Segoe UI",system-ui,sans-serif;padding:24px max(16px,env(safe-area-inset-left,0px))}
form{width:min(380px,100%);background:var(--paper);border:1px solid var(--line);border-radius:10px;padding:26px 24px;display:grid;gap:14px}
h1{margin:0;font:700 1.7rem/1.1 "Arial Narrow","Roboto Condensed",sans-serif;letter-spacing:.01em}
.cable{display:flex;height:4px;border-radius:2px;overflow:hidden}.cable span{flex:1}
p{margin:0;color:var(--muted);font-size:.92rem}
label{font-size:.85rem;color:var(--muted);display:grid;gap:4px}
input[type=password]{font:inherit;color:inherit;background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:9px 10px}
.row{display:flex;align-items:center;gap:6px;font-size:.88rem;color:var(--muted)}
button{font:inherit;font-weight:600;background:var(--accent);color:var(--accent-ink);border:0;border-radius:6px;padding:10px 14px;cursor:pointer}
button:disabled{opacity:.6}
.err{color:var(--bad);font-size:.9rem;min-height:1.3em}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
small{color:var(--muted);font-size:.78rem}
</style></head>

const KEY = "trei-trainer-code";
const b64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
async function unlock(pw){
  const base = await crypto.subtle.importKey("raw", new TextEncoder().encode(pw), "PBKDF2", false, ["deriveKey"]);
  const key = await crypto.subtle.deriveKey({name:"PBKDF2", salt:b64(P.s), iterations:P.n, hash:"SHA-256"}, base, {name:"AES-GCM", length:256}, false, ["decrypt"]);
  const plain = await crypto.subtle.decrypt({name:"AES-GCM", iv:b64(P.i)}, key, b64(P.c));
  return new TextDecoder().decode(plain);
}
function show(html){ document.open(); document.write(html); document.close(); }
const f = document.getElementById("f"), err = document.getElementById("err"), go = document.getElementById("go");
f.addEventListener("submit", async e => {
  e.preventDefault(); err.textContent = ""; go.disabled = true; go.textContent = "Wird geöffnet …";
  const pw = document.getElementById("pw").value;
  try{
    const html = await unlock(pw);
    try{ sessionStorage.setItem(KEY, pw); if(document.getElementById("remember").checked) localStorage.setItem(KEY, pw); else localStorage.removeItem(KEY); }catch(_){}
    show(html);
  }catch(_){
    err.textContent = "Der Zugangscode stimmt nicht. Bitte noch einmal versuchen.";
    go.disabled = false; go.textContent = "Öffnen";
  }
});
(async () => {
  let saved = null; try{ saved = localStorage.getItem(KEY) || sessionStorage.getItem(KEY); }catch(_){}
  if(saved){ try{ show(await unlock(saved)); }catch(_){ try{ localStorage.removeItem(KEY); sessionStorage.removeItem(KEY); }catch(__){} } }
})();
</script>
